---
layout: base
---
<article class="post">

  {% if page.prev-link or page.next-link %}
  <header class="post-header post-header-nav">
    <div class="post-nav {% if page.prev-link == null %}hidden{% endif %}">
      <a id="post-prev" href="{{ page.prev-link }}">
        🞀
      </a>
    </div>
    <h1 class="post-title">{{ page.title | escape | markdownify }}</h1>
    <div class="post-nav {% if page.next-link == null %}hidden{% endif %}">
      <a id="post-next" href="{{ page.next-link }}">
        🞂
      </a>
    </div>
  </header>

  {% else %}

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape | markdownify }}</h1>
    <subtitle class="post-subtitle">{{ page.subtitle | escape | markdownify }}</subtitle>
  </header>

  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
